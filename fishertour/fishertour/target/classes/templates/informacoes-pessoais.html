<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisher Tour - Informações Pessoais</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #fbf9f6;
            color: #2c1a11;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 500px;
            box-sizing: border-box;
        }

        h2 {
            font-family: 'Playfair Display', serif;
            font-size: 28px;
            margin-bottom: 25px;
            color: #2c1a11;
            text-align: center;
        }

        .info-group {
            margin-bottom: 18px;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 10px;
        }

        .info-label {
            font-size: 12px;
            color: #888;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .info-value {
            font-size: 16px;
            color: #333;
            font-weight: 600;
        }

        .btn-voltar {
            display: block;
            width: 100%;
            background-color: #002147;
            color: white;
            text-align: center;
            padding: 14px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            margin-top: 30px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }

        .btn-voltar:hover {
            background-color: #001530;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Informações Pessoais</h2>

    <div class="info-group">
        <div class="info-label">Nome Completo</div>
        <div class="info-value" th:text="${usuario.nomeCompleto}">Nome do Usuário</div>
    </div>

    <div class="info-group">
        <div class="info-label">E-mail</div>
        <div class="info-value" th:text="${usuario.email}">email@exemplo.com</div>
    </div>

    <div class="info-group">
        <div class="info-label">Idade</div>
        <div class="info-value" th:text="${usuario.idade}">--</div>
    </div>

    <div class="info-group">
        <div class="info-label">Data de Nascimento</div>
        <div class="info-value" th:text="${usuario.dataNascimento}">--/--/----</div>
    </div>

    <div class="info-group">
        <div class="info-label">CPF</div>
        <div class="info-value" th:text="${usuario.cpf}">000.000.000-00</div>
    </div>

    <div class="info-group">
        <div class="info-label">Endereço</div>
        <div class="info-value" th:text="${usuario.endereco}">Rua Exemplo, 123</div>
    </div>

    <div class="info-group">
        <div class="info-label">CEP</div>
        <div class="info-value" th:text="${usuario.cep}">00000-000</div>
    </div>

    <a href="/" class="btn-voltar">Voltar para a Página Inicial</a>
</div>

</body>
</html>
