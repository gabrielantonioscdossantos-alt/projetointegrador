<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fisher Tour - Nova Senha</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;600&display=swap');

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', sans-serif;
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), url('/tela-login.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%; max-width: 400px;
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 40px 30px;
            box-sizing: border-box;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            color: #2c1a11;
            margin-bottom: 15px;
        }

        p { font-size: 13px; color: #666; margin-bottom: 25px; }

        .input-group {
            position: relative;
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group input {
            width: 100%;
            padding: 12px 10px 12px 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background: #fff;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
        }

        .btn-primary {
            width: 100%; 
            padding: 14px;
            background-color: #002147;
            color: white; 
            border: none;
            border-radius: 30px; 
            font-size: 15px; 
            font-weight: 600;
            cursor: pointer; 
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h1>Nova Senha</h1>
    <p>Insira o código enviado por e-mail e defina sua nova senha.</p>

    <p th:if="${erro}" th:text="${erro}" style="color: red; font-size: 13px;"></p>

    <form action="/salvar-nova-senha" method="POST">
        <input type="hidden" name="email" th:value="${email}">
        
        <div class="input-group">
            <input type="text" name="codigo" placeholder="Código de 6 dígitos" required>
        </div>

        <div class="input-group">
            <input type="password" name="novaSenha" placeholder="Digite a nova senha" required>
        </div>

        <button type="submit" class="btn-primary">Alterar Senha</button>
    </form>
</div>

</body>
</html>
